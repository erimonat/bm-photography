# Sveltia CMS configuration. Editors sign in with GitHub; they never see Git.
# Sign-in: token by default. To get a "Sign in with GitHub" button, deploy the Sveltia CMS Authenticator
# (a small Cloudflare Worker) and add its address as backend.base_url below.
backend:
  name: github
  repo: erimonat/bm-photography
  branch: main
  base_url: https://auth.berkaymavral.com

# Photographs are stored in Cloudinary, never in this repository. The API key is public by design; the API secret must never be put here.
media_libraries:
  cloudinary:
    config:
      cloud_name: rnntoe86
      api_key: "676696769616734"

site_url: https://www.berkaymavral.com
display_url: https://www.berkaymavral.com

media_folder: media/uploads
public_folder: /media/uploads

collections:
  - name: gallery
    label: Galeri
    files:
      - name: photos
        label: Fotoğraflar
        file: content/photos.json
        format: json
        fields:
          - name: photos
            label: Fotoğraflar
            label_singular: fotoğraf
            hint: "Yeni fotoğraf eklemek için alttaki Ekle düğmesine basın. Sıra, sitedeki arka plan sırasıdır: yukarıdan aşağıya."
            widget: list
            summary: "{{fields.caption.tr}}"
            fields:
              - { name: id, widget: hidden }
              - { name: source, widget: hidden }
              - name: image
                label: Fotoğraf (Cloudinary'den seçin ya da yükleyin)
                hint: "Fotoğrafın yatay mı dikey mi olduğu otomatik anlaşılır. Eski Pexels fotoğraflarında bu alan boştur."
                widget: image
                required: false
                media_library: { name: cloudinary }
              - { name: ref, label: Eski Pexels fotoğraf numarası (Cloudinary'den seçtiyseniz boş bırakın), widget: string, required: false }
              - name: light
                label: Işık türü
                widget: select
                options:
                  - { label: Altın saat, value: gold }
                  - { label: Gün ışığı, value: day }
                  - { label: Mavi saat, value: blue }
                  - { label: Gece, value: dark }
              - { name: orientation, widget: hidden }
              - { name: hero, label: Açılış sahnesinde çıkabilir (büyük fotoğraf ve etrafındaki duvar, her ziyarette rastgele), widget: boolean, default: false }
              - name: caption
                label: Açıklama
                widget: object
                fields:
                  - { name: tr, label: Türkçe, widget: string, required: true, pattern: ["^.{1,140}$", "En fazla 140 karakter, boş bırakılmasın"] }
                  - { name: en, label: İngilizce (boş bırakılırsa Türkçe gösterilir), widget: string, required: false, pattern: ["^.{0,140}$", "En fazla 140 karakter"] }

  - name: settings
    label: Site ayarları
    files:
      - name: site
        label: İletişim ve metinler
        file: content/site.json
        format: json
        fields:
          - { name: email, label: E-posta, widget: string, pattern: ["^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$", "Geçerli bir e-posta adresi yazın"] }
          - { name: instagram, label: Instagram bağlantısı, widget: string }
          - { name: pexels, label: Pexels bağlantısı, widget: string }
          - { name: url, widget: hidden }
          - { name: cloudinary, widget: hidden }
          - name: texts
            label: Metinler
            hint: "Her alanın başındaki ad, metnin sitenin hangi bölümünde olduğunu gösterir."
            widget: object
            fields:
              - name: workH2
                label: "Galeri · Başlık"
                hint: "Nerede görünür: Galeri bölümünün büyük başlığı."
                widget: object
                fields:
                  - { name: tr, label: Türkçe, widget: string, required: true, pattern: ["^.{1,80}$", "80 karakterden uzun olmasın ve boş bırakılmasın"] }
                  - { name: en, label: İngilizce (boş bırakılırsa Türkçe gösterilir), widget: string, required: false, pattern: ["^.{0,80}$", "80 karakterden uzun olmasın"] }
              - name: lead
                label: "Hakkımda · Büyük giriş cümlesi"
                hint: "Nerede görünür: Hakkımda bölümünde fotoğrafın yanındaki büyük cümle."
                widget: object
                fields:
                  - { name: tr, label: Türkçe, widget: text, required: true, pattern: ["^[\\s\\S]{1,240}$", "240 karakterden uzun olmasın ve boş bırakılmasın"] }
                  - { name: en, label: İngilizce (boş bırakılırsa Türkçe gösterilir), widget: text, required: false, pattern: ["^[\\s\\S]{0,240}$", "240 karakterden uzun olmasın"] }
              - name: note
                label: "Hakkımda · Kısa not"
                hint: "Nerede görünür: Büyük cümlenin altındaki küçük yazı. Kalın yazı için yazıyı <strong> ve </strong> arasına alın."
                widget: object
                fields:
                  - { name: tr, label: Türkçe, widget: text, required: true, pattern: ["^[\\s\\S]{1,300}$", "300 karakterden uzun olmasın ve boş bırakılmasın"] }
                  - { name: en, label: İngilizce (boş bırakılırsa Türkçe gösterilir), widget: text, required: false, pattern: ["^[\\s\\S]{0,300}$", "300 karakterden uzun olmasın"] }
              - name: shUrban
                label: "Hakkımda · Çalışma türü 1: ad"
                hint: "Nerede görünür: Hakkımda bölümünün altındaki üç kutudan birincinin başlığı."
                widget: object
                fields:
                  - { name: tr, label: Türkçe, widget: string, required: true, pattern: ["^.{1,40}$", "40 karakterden uzun olmasın ve boş bırakılmasın"] }
                  - { name: en, label: İngilizce (boş bırakılırsa Türkçe gösterilir), widget: string, required: false, pattern: ["^.{0,40}$", "40 karakterden uzun olmasın"] }
              - name: shUrbanD
                label: "Hakkımda · Çalışma türü 1: açıklama"
                hint: "Nerede görünür: Birinci kutunun açıklaması."
                widget: object
                fields:
                  - { name: tr, label: Türkçe, widget: string, required: true, pattern: ["^.{1,90}$", "90 karakterden uzun olmasın ve boş bırakılmasın"] }
                  - { name: en, label: İngilizce (boş bırakılırsa Türkçe gösterilir), widget: string, required: false, pattern: ["^.{0,90}$", "90 karakterden uzun olmasın"] }
              - name: shArch
                label: "Hakkımda · Çalışma türü 2: ad"
                hint: "Nerede görünür: İkinci kutunun başlığı."
                widget: object
