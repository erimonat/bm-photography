# After every push to live, write a short classified note on the commit: what changed in photos, texts and contact details.
# Uses only the built-in token; no secrets. The site itself is built and published by Cloudflare, not by this workflow.
name: Panel notes

on:
  push:
    branches: [live]

permissions:
  contents: write

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify the change
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/panel-notes.cjs
